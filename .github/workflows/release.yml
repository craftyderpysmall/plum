# Push a tag like v0.2.0 (matching the plum-app version) to build the Windows
# zip, publish it as a GitHub release and open a winget-pkgs PR for it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $crate = (Select-String -Path crates/plum-app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $crate) { throw "tag v$tag does not match plum-app version $crate" }
          "VERSION=$tag" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked -p plum-app

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item target/release/plum-app.exe stage/plum.exe
          $zip = "plum-$env:VERSION-x86_64-windows.zip"
          Compress-Archive -Path stage/plum.exe -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ZIP" --title "Plum $env:VERSION" --generate-notes

      # Needs the package to already exist in winget-pkgs, and a WINGET_TOKEN
      # secret: a classic PAT with public_repo scope (wingetcreate forks
      # microsoft/winget-pkgs under that account and opens the PR from it).
      - name: Submit to winget
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$env:ZIP"
          ./wingetcreate.exe update craftyderpysmall.Plum --version $env:VERSION --urls $url --submit --token $env:WINGET_TOKEN
