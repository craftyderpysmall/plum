# Builds on the dark theme and only swaps the palette-specific colors.
[meta]
name = "Nord"
author = "Plum"
extends = "dark"

[colors]
canvas        = "#2e3440"
grid          = "#3b4252"
grid_major    = "#434c5e"
selection     = "#88c0d0"
selection_fill = "#88c0d012"
marquee       = "#88c0d0"
marquee_fill  = "#88c0d01f"
hover         = "#88c0d066"
handle_fill   = "#2e3440"
handle_stroke = "#88c0d0"
rotate_handle = "#88c0d0"
panel         = "#3b4252f2"
text          = "#eceff4"
text_muted    = "#9aa3b5"
accent        = "#88c0d0"
accent_text   = "#2e3440"

[ui]
corner_radius = 6.0

[palette]
colors = [
  "#eceff4", "#d8dee9", "#bf616a", "#d08770",
  "#a3be8c", "#81a1c1", "#b48ead", "#ebcb8b",
  "#2e3440",
]
